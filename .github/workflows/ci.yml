name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Headless tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # sounddevice imports PortAudio at import time; the pure tests pull it in
      # transitively, so the shared lib must exist before install/run.
      - name: Install PortAudio system library
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 pulseaudio pulseaudio-utils bubblewrap

      # Ubuntu 26.04's PortAudio refuses to initialize without a PulseAudio
      # server to connect to, and runners have no sound hardware or server.
      # A null sink gives it a server without any audio going anywhere.
      - name: Start a silent PulseAudio server
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink

      # [webrtc] pulls webrtcvad-wheels so the WebRTC VAD contract test runs too.
      - name: Install package
        run: pip install -e ".[webrtc]"

      # talk2me.audio treats a failed import as "no audio here" and carries on,
      # which is right for users but would let this job test the wrong path.
      - name: Check sounddevice loads
        run: python -c "import sounddevice as sd; print(sd.get_portaudio_version()); print(sd.query_devices())"

      # Pure tests — no mic, no model download, no claude. Each returns a proper
      # exit code, so a FAIL fails the job. (The old `[ -f x ] && run || echo`
      # guards swallowed real test failures: `||` fires on a failing test, not
      # just a missing file. All files are committed now — run them directly.)
      - name: test_segment
        run: python -m tests.test_segment

      - name: test_loop_offline
        run: python -m tests.test_loop_offline

      - name: test_factory
        run: python -m tests.test_factory

      - name: test_sentences
        run: python -m tests.test_sentences

      - name: test_backend_translate
        run: python -m tests.test_backend_translate

      - name: test_devices
        run: python -m tests.test_devices

      - name: test_webrtc_vad
        run: python -m tests.test_webrtc_vad

      - name: test_permission
        run: python -m tests.test_permission

      - name: test_barge_in
        run: python -m tests.test_barge_in

      - name: test_speaker_stop
        run: python -m tests.test_speaker_stop

      - name: test_continuation
        run: python -m tests.test_continuation

      - name: test_flow
        run: python -m tests.test_flow

      - name: test_render
        run: python -m tests.test_render

      - name: test_retro
        run: python -m tests.test_retro

      - name: test_codex_translate
        run: python -m tests.test_codex_translate

      - name: test_wizard
        run: python -m tests.test_wizard

      - name: test_phone
        run: python -m tests.test_phone

      - name: test_voicelock
        run: python -m tests.test_voicelock

      - name: test_echogate
        run: python -m tests.test_echogate

      - name: test_vpio
        run: python -m tests.test_vpio

      - name: test_typeline
        run: python -m tests.test_typeline

      - name: test_mlx_whisper
        run: python -m tests.test_mlx_whisper

      - name: test_voice_commands
        run: python -m tests.test_voice_commands

      - name: test_sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          python -m tests.test_sandbox

  sandbox-linux:
    name: OS sandbox, real claude CLI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install bubblewrap and PortAudio
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap libportaudio2
          # Ubuntu's AppArmor blocks the unprivileged namespaces bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: pip install -e .
      - name: Hostile script against the sandbox
        run: python -m tests.test_sandbox
      # No account needed: a fake local endpoint plays the model.
      - run: npm install -g @anthropic-ai/claude-code
      - name: Hostile script through the real claude CLI
        run: python -m tests.manual_sandbox_check

  sandbox-macos:
    name: OS sandbox, real claude CLI (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Hostile script against the sandbox
        run: python -m tests.test_sandbox
      - run: npm install -g @anthropic-ai/claude-code
      - name: Hostile script through the real claude CLI
        run: python -m tests.manual_sandbox_check

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Pinned: this repo has no ruff config, so each release's default rules
      # apply. Unpinned, ruff 0.16 turned this job red with no code change.
      - name: Install ruff
        run: pip install "ruff==0.17.3"

      - name: ruff check
        run: ruff check talk2me tests
